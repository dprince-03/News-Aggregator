# Mounted read-only into the client container at /etc/nginx/conf.d/default.conf
# (see infra/docker/docker-compose.yml). Serves the built React SPA and
# reverse-proxies /api/* to the server container.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript
        text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    # HSTS only makes sense once this is actually served over HTTPS (this
    # nginx is HTTP-only by design - see infra/README.md's TLS note) but is
    # harmless to declare now for whatever terminates TLS in front of it.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    # img-src needs the https: wildcard because the whole point of this app
    # is rendering article thumbnails hotlinked from arbitrary news
    # publishers - there's no fixed domain list to allowlist instead.
    # script-src keeps 'unsafe-inline' for the small no-flash dark-mode
    # script in index.html (static, build-time, not user-influenced) -
    # tightening that further would need a nonce/hash pipeline nginx alone
    # can't provide for a purely static SPA build.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;

    # Reverse proxy to the API server. The bare "/api" root (no trailing
    # slash) is a real documented endpoint (server.js's endpoint listing) -
    # give it an exact-match location too, otherwise the prefix location
    # below only matches "/api/" and nginx 301s "/api" to "/api/" first.
    location = /api {
        proxy_pass http://server:5080/api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        proxy_pass http://server:5080/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Long-cache hashed build assets
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA fallback so client-side routes (e.g. /article/123) don't 404 on refresh
    location / {
        try_files $uri $uri/ /index.html;
    }
}

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  server:
    name: Server (lint, test, boot check)
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: yes
          MYSQL_DATABASE: news_aggregator_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    defaults:
      run:
        working-directory: server

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run test suite
        run: npm test
        env:
          NODE_ENV: test
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_USER: root
          DB_PASSWORD: ''
          DB_NAME: news_aggregator
          TEST_DB_NAME: news_aggregator_test
          JWT_SECRET: ci_test_jwt_secret_at_least_32_characters_long
          JWT_REFRESH_SECRET: ci_test_refresh_secret_at_least_32_characters
          SESSION_SECRET: ci_test_session_secret_at_least_32_characters

      - name: Verify the server boots (secrets validate, app loads, DB connects)
        run: timeout 20 node server.js || [ $? -eq 124 ]
        env:
          NODE_ENV: development
          PORT: 5099
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_USER: root
          DB_PASSWORD: ''
          DB_NAME: news_aggregator_test
          JWT_SECRET: ci_test_jwt_secret_at_least_32_characters_long
          JWT_REFRESH_SECRET: ci_test_refresh_secret_at_least_32_characters
          SESSION_SECRET: ci_test_session_secret_at_least_32_characters

  client:
    name: Client (lint, test, build)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: client

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Run test suite
        run: npm test -- --run

      - name: Build
        run: npm run build

  e2e:
    name: E2E (Playwright, against a real server + DB)
    runs-on: ubuntu-latest
    needs: [server, client]

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: yes
          MYSQL_DATABASE: news_aggregator
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: ''
      DB_NAME: news_aggregator
      JWT_SECRET: ci_test_jwt_secret_at_least_32_characters_long
      JWT_REFRESH_SECRET: ci_test_refresh_secret_at_least_32_characters
      SESSION_SECRET: ci_test_session_secret_at_least_32_characters
      PORT: 5080
      NODE_ENV: development
      ENABLE_CRON: 'false'
      CORS_ORIGINS: http://localhost:4173

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'

      - name: Install server dependencies
        working-directory: server
        run: npm ci

      - name: Create schema and seed the E2E article
        working-directory: server
        run: |
          node -e "require('./src/models').sequelize.sync({ force: true }).then(() => process.exit(0))"
          node scripts/seed-e2e-article.js

      - name: Start server in the background
        working-directory: server
        run: nohup node server.js > /tmp/server.log 2>&1 &

      - name: Wait for the server to be healthy
        run: timeout 30 bash -c 'until curl -sf http://localhost:5080/api/health >/dev/null; do sleep 1; done'

      - name: Install client dependencies
        working-directory: client
        run: npm ci

      - name: Install Playwright browsers
        working-directory: client
        run: npx playwright install --with-deps chromium

      - name: Build client
        working-directory: client
        run: npm run build

      - name: Start client preview in the background
        working-directory: client
        run: nohup npm run preview > /tmp/client.log 2>&1 &

      - name: Wait for the client preview to be up
        run: timeout 30 bash -c 'until curl -sf http://localhost:4173/ >/dev/null; do sleep 1; done'

      - name: Run E2E suite
        working-directory: client
        run: npm run test:e2e

      - name: Upload logs and Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: e2e-failure-artifacts
          path: |
            client/playwright-report/
            client/test-results/
            /tmp/server.log
            /tmp/client.log

  docker:
    name: Docker images build
    runs-on: ubuntu-latest
    needs: [server, client]

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Build server image
        run: docker build -f infra/docker/server.Dockerfile -t newshub-server:ci server

      - name: Build client image
        run: docker build -f infra/docker/client.Dockerfile -t newshub-client:ci client
